<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vigia - Rastreo en Tiempo Real</title>

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  
  <!-- Fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* ═══════════════════════════════════════════════════════════════════ */
    /* ESTILOS CSS - Diseño oscuro moderno */
    /* ═══════════════════════════════════════════════════════════════════ */
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #00ff88;
      --text: #e8e8f0;
      --muted: #7f7f9a;
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    
    /* Header con logo y estado de conexión */
    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 14px 24px; 
      background: var(--surface); 
      border-bottom: 1px solid var(--border); 
      flex-shrink: 0; 
    }
    
    .logo { 
      font-size: 1.2rem; 
      font-weight: 700; 
      color: var(--accent); 
      letter-spacing: 0.05em; 
    }
    
    /* Indicador de conexión (punto verde parpadeante) */
    .badge { 
      display: flex; 
      align-items: center; 
      gap: 7px; 
      font-size: 0.75rem; 
      font-weight: 500; 
      color: var(--muted); 
      background: var(--bg); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      padding: 5px 14px; 
    }
    
    .dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: var(--muted); 
    }
    
    .dot.live { 
      background: var(--accent); 
      animation: blink 1.5s infinite; 
    }
    
    @keyframes blink { 
      0%, 100% { opacity: 1; } 
      50% { opacity: 0.4; } 
    }
    
    /* Layout principal: mapa + panel lateral */
    .main { 
      display: flex; 
      flex: 1; 
      overflow: hidden; 
    }
    
    #map { 
      flex: 1; 
      position: relative; 
    }
    
    /* Panel de información lateral */
    .panel { 
      width: 270px; 
      background: var(--surface); 
      border-left: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      padding: 24px 20px; 
      flex-shrink: 0; 
      overflow-y: auto; 
    }
    
    .panel-top { 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }
    
    /* Etiquetas de sección */
    .section-label { 
      font-size: 0.68rem; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.12em; 
      color: var(--muted); 
      margin-bottom: 10px; 
    }
    
    /* Tarjetas de información */
    .info-card { 
      background: var(--bg); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 14px 16px; 
      margin-bottom: 10px; 
    }
    
    .info-label { 
      font-size: 0.65rem; 
      font-weight: 500; 
      color: var(--muted); 
      text-transform: uppercase; 
      letter-spacing: 0.1em; 
      margin-bottom: 6px; 
    }
    
    .info-value { 
      font-size: 1rem; 
      font-weight: 600; 
      color: var(--accent); 
    }
    
    .info-value.time { color: var(--text); font-size: 0.95rem; }
    .info-value.estado-dentro { color: #00ff88; }
    .info-value.estado-fuera { color: #ff4444; }
    .info-value.estado-neutro { color: var(--muted); }
    
    /* Botones de control */
    .btn-row { 
      display: flex; 
      gap: 6px; 
      margin-top: 2px; 
    }
    
    .btn-geo { 
      flex: 1; 
      padding: 7px 4px; 
      font-size: 0.7rem; 
      font-weight: 600; 
      font-family: 'Inter', sans-serif; 
      border-radius: 7px; 
      border: 1px solid; 
      cursor: pointer; 
      background: transparent; 
      transition: opacity 0.2s; 
      letter-spacing: 0.03em; 
    }
    
    .btn-geo:disabled { opacity: 0.3; cursor: default; }
    .btn-geo.blue { color: #3399ff; border-color: #3399ff; }
    .btn-geo.blue:not(:disabled):hover { background: #3399ff22; }
    .btn-geo.green { color: #00ff88; border-color: #00ff88; }
    .btn-geo.green:not(:disabled):hover { background: #00ff8822; }
    .btn-geo.red { color: #ff4444; border-color: #ff4444; }
    .btn-geo.red:not(:disabled):hover { background: #ff444422; }
    
    /* Instrucciones flotantes */
    .instruccion { 
      font-size: 0.72rem; 
      color: var(--muted); 
      text-align: center; 
      padding: 8px; 
      border: 1px dashed var(--border); 
      border-radius: 8px; 
      display: none; 
      line-height: 1.6; 
    }
    
    /* Footer */
    .footer { 
      font-size: 0.68rem; 
      color: var(--muted); 
      text-align: center; 
      padding-top: 16px; 
      border-top: 1px solid var(--border); 
      line-height: 1.7; 
    }
    
    /* Marcador del dispositivo */
    .marker-arrow { 
      width: 18px; 
      height: 18px; 
      background: #00ff88; 
      border-radius: 50%; 
      box-shadow: 0 0 10px rgba(0,255,136,0.8); 
    }
    
    /* Pantalla de carga */
    #loading { 
      position: absolute; 
      inset: 0; 
      background: var(--bg); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 14px; 
      z-index: 100; 
      transition: opacity 0.5s; 
    }
    
    #loading.hidden { opacity: 0; pointer-events: none; }
    
    .spinner { 
      width: 36px; 
      height: 36px; 
      border: 3px solid var(--border); 
      border-top-color: var(--accent); 
      border-radius: 50%; 
      animation: spin 0.8s linear infinite; 
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Responsive para móviles */
    @media (max-width: 768px) {
      body { height: auto; overflow: auto; }
      .main { flex-direction: column; overflow: visible; }
      #map { height: 55vh; flex: none; }
      .panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>

<body>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- HTML ESTRUCTURA - Header, mapa y panel lateral -->
<!-- ═══════════════════════════════════════════════════════════════════ -->

<header>
  <div class="logo">Vigia</div>
  <div class="badge">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Conectando...</span>
  </div>
</header>

<div class="main">
  <!-- Contenedor del mapa -->
  <div id="map">
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Cargando mapa...</div>
    </div>
  </div>

  <!-- Panel de información -->
  <div class="panel">
    <div class="panel-top">

      <!-- Sección: Ubicación en tiempo real -->
      <div>
        <div class="section-label">Ubicación en tiempo real</div>
        <div class="info-card">
          <div class="info-label">Latitud</div>
          <div class="info-value" id="latVal">Esperando señal...</div>
        </div>
        <div class="info-card">
          <div class="info-label">Longitud</div>
          <div class="info-value" id="lonVal">Esperando señal...</div>
        </div>
        <div class="info-card">
          <div class="info-label">Última actualización</div>
          <div class="info-value time" id="timeVal">—</div>
        </div>
      </div>

      <!-- Sección: Geocerca -->
      <div>
        <div class="section-label">Geocerca</div>
        <div class="info-card">
          <div class="info-label">Estado</div>
          <div class="info-value estado-neutro" id="estadoVal">Sin geocerca</div>
        </div>
        <div class="info-card">
          <div class="info-label">Distancia al centro</div>

    </div>

    <div class="footer">
      Desarrollado por<br><strong>Martín Leaño</strong>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- JAVASCRIPT - Lógica de la aplicación web -->
<!-- ═══════════════════════════════════════════════════════════════════ -->

<script>
  // ═══════════════════════════════════════════════════════════════════
  // CONFIGURACIÓN - Tokens y credenciales
  // ═══════════════════════════════════════════════════════════════════
  
  const MAPBOX_TOKEN = "pk.eyJ1Ijoia2F0Zmlwb2wiLCJhIjoiY21tMjd0eTd1MDRvMjJxb2lydnFvZDg5biJ9.ta7YuRSTXUkBQ0OtrXRBmQ";

  const firebaseConfig = {
    apiKey: "AIzaSyDjMPXFeeGnPJsHQFfv4w78Axs-VYY70rQ",
    authDomain: "proyectomapbox-74728.firebaseapp.com",
    projectId: "proyectomapbox-74728",
    storageBucket: "proyectomapbox-74728.firebasestorage.app",
    messagingSenderId: "957759450960",
    appId: "1:957759450960:web:af91e7db6fdf21da1f4655"
  };

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Inicializar Mapbox
  mapboxgl.accessToken = MAPBOX_TOKEN;

  // Crear mapa centrado en La Paz, Bolivia
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [-68.1239, -16.4809],
    zoom: 15
  });

  // Agregar controles de navegación
  map.addControl(new mapboxgl.NavigationControl(), 'top-left');

  // Crear marcador del dispositivo
  const el = document.createElement('div');
  el.className = 'marker-arrow';
  const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
    .setLngLat([-68.1239, -16.4809])
    .addTo(map);

  // ═══════════════════════════════════════════════════════════════════
  // VARIABLES DE ESTADO
  // ═══════════════════════════════════════════════════════════════════
  
  let modoDibujo = false;      // Estoy dibujando una geocerca
  let poligonoListo = false;   // Tengo un polígono cerrado
  let puntosPoligono = [];      // Lista de vértices [lng, lat]
  let ultimaPos = null;         // Última posición recibida del GPS
  let dentroGeocerca = true;    // Estado actual (para detectar cambios)

  // ═══════════════════════════════════════════════════════════════════
  // INICIALIZACIÓN DEL MAPA
  // ═══════════════════════════════════════════════════════════════════
  
  map.on('load', () => {
    document.getElementById('loading').classList.add('hidden');
    inicializarCapasGeocerca();
  });

  // Crear las capas del mapa para dibujar geocercas
  function inicializarCapasGeocerca() {
    // Fuente vacía para el polígono final
    map.addSource('geocerca-source', { 
      type: 'geojson', 
      data: geometriaVacia() 
    });
    
    // Fuente para los vértices (puntos)
    map.addSource('vertices-source', { 
      type: 'geojson', 
      data: { type: 'FeatureCollection', features: [] } 
    });
    
    // Fuente para la línea de borrador
    map.addSource('linea-source', { 
      type: 'geojson', 
      data: geometriaVacia() 
    });

    // Capa de relleno del polígono
    map.addLayer({
      id: 'geocerca-relleno',
      type: 'fill',
      source: 'geocerca-source',
      paint: { 'fill-color': '#3399ff', 'fill-opacity': 0.15 }
    });

    // Capa de borde del polígono
    map.addLayer({
      id: 'geocerca-borde',
      type: 'line',
      source: 'geocerca-source',
      paint: { 'line-color': '#3399ff', 'line-width': 2.5 }
    });

    // Capa de línea punteada (borrador)
    map.addLayer({
      id: 'linea-layer',
      type: 'line',
      source: 'linea-source',
      paint: { 
        'line-color': '#3399ff', 
        'line-width': 2, 
        'line-dasharray': [2, 1.5] 
      }
    });

    // Capa de círculos (vértices)
    map.addLayer({
      id: 'vertices-layer',
      type: 'circle',
      source: 'vertices-source',
      paint: { 
        'circle-radius': 7, 
        'circle-color': '#ffffff', 
        'circle-stroke-width': 2.5, 
        'circle-stroke-color': '#3399ff' 
      }
    });
  }

  function geometriaVacia() {
    return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [[]] } };
  }

  // ═══════════════════════════════════════════════════════════════════
  // DIBUJO DE GEOCERCA - Interacción con el mapa
  // ═══════════════════════════════════════════════════════════════════
  
  // Clic en el mapa: agregar vértice
  map.on('click', (e) => {
    if (!modoDibujo) return;  // Solo en modo dibujo

    // Guardar coordenada [lng, lat]
    puntosPoligono.push([e.lngLat.lng, e.lngLat.lat]);

    // Habilitar CERRAR con 3+ puntos
    if (puntosPoligono.length >= 3) {
      document.getElementById('btnCerrar').disabled = false;
    }

    // Actualizar dibujo
    actualizarDibujoParcial();

    // Actualizar instrucción
    const n = puntosPoligono.length;
    document.getElementById('instruccion').innerHTML =
      n + ' vértice(s) — agrega más o presiona CERRAR';
  });

  // Actualiza los puntos y línea mientras dibujo
  function actualizarDibujoParcial() {
    // Actualizar vértices
    const features = puntosPoligono.map(p => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: p }
    }));
    
    map.getSource('vertices-source').setData({
      type: 'FeatureCollection',
      features
    });

    // Actualizar línea si hay 2+ puntos
    if (puntosPoligono.length >= 2) {
      map.getSource('linea-source').setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: puntosPoligono }
      });
    }
  }

  // ═══════════════════════════════════════════════════════════════════
  // BOTONES - Control del flujo
  // ═══════════════════════════════════════════════════════════════════
  
  // BOTÓN DIBUJAR: Iniciar nueva geocerca
  document.getElementById('btnDibujar').addEventListener('click', () => {
    modoDibujo = true;
    poligonoListo = false;
    puntosPoligono = [];
    limpiarCapas();

    document.getElementById('btnCerrar').disabled = true;
    document.getElementById('btnLimpiar').disabled = false;
    document.getElementById('instruccion').style.display = 'block';
    document.getElementById('instruccion').innerHTML = 
      'Haz clic en el mapa<br>para agregar vértices';
    
    setEstado('Dibujando...', 'neutro');
    document.getElementById('distVal').textContent = '— m';
  });

  // BOTÓN CERRAR: Cerrar polígono y compartir con la app
  document.getElementById('btnCerrar').addEventListener('click', () => {
    if (puntosPoligono.length < 3) return;

    modoDibujo = false;
    poligonoListo = true;

    dibujarPoligonoFinal();

    document.getElementById('btnCerrar').disabled = true;
    document.getElementById('instruccion').style.display = 'none';

    // ═════════════════════════════════════════════════════════════════
    // IMPORTANTE: Compartir con la app via Firebase
    // ═════════════════════════════════════════════════════════════════
    const nombre = prompt('Nombre de la geocerca:', 'Mi Geocerca');
    if (nombre) {
      compartirGeocercaFirebase(nombre);
    }

    // Verificar si ya tengo posición del dispositivo
    if (ultimaPos) verificarGeocerca(ultimaPos.lat, ultimaPos.lon);
  });

  // BOTÓN LIMPIAR: Borrar todo
  document.getElementById('btnLimpiar').addEventListener('click', () => {
    modoDibujo = false;
    poligonoListo = false;
    puntosPoligono = [];
    limpiarCapas();

    document.getElementById('btnCerrar').disabled = true;
    document.getElementById('btnLimpiar').disabled = true;
    document.getElementById('instruccion').style.display = 'none';
    
    setEstado('Sin geocerca', 'neutro');
    document.getElementById('distVal').textContent = '— m';

    // También borrar de Firebase
    borrarGeocercaFirebase();
  });

  // Dibuja el polígono final cerrado
  function dibujarPoligonoFinal() {
    limpiarCapas();
    const coords = [...puntosPoligono, puntosPoligono[0]]; // Cerrar
    map.getSource('geocerca-source').setData({
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [coords] }
    });
  }

  // Limpia todas las capas
  function limpiarCapas() {
    map.getSource('geocerca-source')?.setData(geometriaVacia());
    map.getSource('vertices-source')?.setData({ 
      type: 'FeatureCollection', 
      features: [] 
    });
    map.getSource('linea-source')?.setData({ 
      type: 'Feature', 
      geometry: { type: 'LineString', coordinates: [] } 
    });
  }

  // Cambia color del polígono (verde=dentro, rojo=fuera)
  function actualizarColorPoligono(dentro) {
    const color = dentro ? '#00ff88' : '#ff4444';
    const opacidad = dentro ? 0.10 : 0.22;
    map.setPaintProperty('geocerca-relleno', 'fill-color', color);
    map.setPaintProperty('geocerca-relleno', 'fill-opacity', opacidad);
    map.setPaintProperty('geocerca-borde', 'line-color', color);
  }

  // Actualiza texto de estado
  function setEstado(texto, tipo) {
    const el = document.getElementById('estadoVal');
    el.textContent = texto;
    el.className = 'info-value estado-' + tipo;
  }

  // ═══════════════════════════════════════════════════════════════════
  // SINCRONIZACIÓN CON FIREBASE - Compartir con la app
  // ═══════════════════════════════════════════════════════════════════
  
  // Subir geocerca a Firebase (la app la recibirá)
  function compartirGeocercaFirebase(nombre) {
    // Convertir a formato: "lat,lon|lat,lon|..."
    const verticesTexto = puntosPoligono.map(p => p[1] + ',' + p[0]).join('|');

    const datos = {
      nombre: nombre,
      vertices: verticesTexto,
      desdeWeb: true,      // Marcar que viene de la web
      desdeApp: false,
      activa: true,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection('GeocercaActiva').doc('geocerca_compartida')
      .set(datos)
      .then(() => {
        console.log('Geocerca compartida con la app');
        alert('Geocerca compartida con la app Android');
      })
      .catch(err => console.error('Error al compartir:', err));
  }

  // Borrar geocerca de Firebase
  function borrarGeocercaFirebase() {
    db.collection('GeocercaActiva').doc('geocerca_compartida').delete()
      .then(() => console.log('Geocerca borrada de Firebase'))
      .catch(err => console.error('Error al borrar:', err));
  }

 db.collection('GeocercaActiva').doc('geocerca_compartida')
  .onSnapshot((doc) => {

    if (!doc.exists) return;

    const data = doc.data();

    if (modoDibujo) return; // no interferir si el usuario está dibujando

    console.log("Geocerca recibida desde Firebase");

    cargarGeocercaDesdeApp(data.vertices, data.nombre);
  });

  // Cargar geocerca que hizo la app
  function cargarGeocercaDesdeApp(verticesTexto, nombre) {
    if (!verticesTexto) return;

    // Parsear: "lat,lon|lat,lon" → [[lon,lat], [lon,lat], ...]
    const puntos = verticesTexto.split('|').map(par => {
      const [lat, lon] = par.split(',').map(Number);
      return [lon, lat];  // Mapbox usa [lng, lat]
    });

    if (puntos.length < 3) return;

    puntosPoligono = puntos;
    poligonoListo = true;

    dibujarPoligonoFinal();
    
    setEstado('Geocerca recibida de la app', 'neutro');
    alert('Geocerca "' + nombre + '" recibida de la app Android');

    if (ultimaPos) verificarGeocerca(ultimaPos.lat, ultimaPos.lon);
  }

  // ═══════════════════════════════════════════════════════════════════
  // VERIFICACIÓN DE GEOCERCA - ¿Está el dispositivo dentro?
  // ═══════════════════════════════════════════════════════════════════
  
  // Algoritmo Ray Casting
  function puntoDentroDePoligono(lat, lon) {
    if (puntosPoligono.length < 3) return false;

    let dentro = false;
    let j = puntosPoligono.length - 1;

    for (let i = 0; i < puntosPoligono.length; i++) {
      const xi = puntosPoligono[i][0], yi = puntosPoligono[i][1];
      const xj = puntosPoligono[j][0], yj = puntosPoligono[j][1];

      if ((yi > lat) !== (yj > lat) && 
          lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) {
        dentro = !dentro;
      }
      j = i;
    }
    return dentro;
  }

  // Calcular distancia entre dos puntos (fórmula de Haversine)
  function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371000; // Radio de la Tierra en metros
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + 
              Math.cos(lat1 * Math.PI / 180) * 
              Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // Calcular centroide del polígono
  function calcularCentroide() {
    const lat = puntosPoligono.reduce((s, p) => s + p[1], 0) / puntosPoligono.length;
    const lon = puntosPoligono.reduce((s, p) => s + p[0], 0) / puntosPoligono.length;
    return { lat, lon };
  }

  // Verificar estado y actualizar UI
  function verificarGeocerca(lat, lon) {
    if (!poligonoListo) return;

    const dentro = puntoDentroDePoligono(lat, lon);
    const c = calcularCentroide();
    const dist = calcularDistancia(lat, lon, c.lat, c.lon);

    setEstado(
      dentro ? 'DENTRO de la geocerca' : 'FUERA de la geocerca',
      dentro ? 'dentro' : 'fuera'
    );
    
    document.getElementById('distVal').textContent = 
      Math.round(dist) + ' m del centro';
    
    actualizarColorPoligono(dentro);

    // Detectar cambio de estado para sonar alarma en web
    if (!dentro && dentroGeocerca) {
      console.log('ALERTA: Dispositivo salió de la geocerca');
      // Aquí podrías agregar sonido en la web
    }
    
    dentroGeocerca = dentro;
  }

  // ═══════════════════════════════════════════════════════════════════
  // FIREBASE - Escuchar posición del dispositivo Android
  // ═══════════════════════════════════════════════════════════════════
  
  db.collection('Rastreo').doc('Mi_Celular').onSnapshot((doc) => {
    if (!doc.exists) return;

    const data = doc.data();
    const lat = data.latitud;
    const lon = data.longitud;
    
    // Convertir timestamp de Firebase a Date
    const hora = data.hora?.toDate ? data.hora.toDate() : new Date();

    ultimaPos = { lat, lon };

    // Actualizar UI
    document.getElementById('latVal').textContent = lat.toFixed(6);
    document.getElementById('lonVal').textContent = lon.toFixed(6);
    document.getElementById('timeVal').textContent = 
      hora.toLocaleTimeString('es-MX');

    // Mover marcador
    marker.setLngLat([lon, lat]);

    // Indicar conexión en vivo
    document.getElementById('statusDot').classList.add('live');
    document.getElementById('statusText').textContent = 'En vivo';

    // Verificar geocerca si existe
    if (poligonoListo) verificarGeocerca(lat, lon);

  }, (error) => {
    console.error('Error de Firebase:', error);
    document.getElementById('statusText').textContent = 'Sin conexión';
  });
</script>
